name: import-html

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: fetch page
        run: curl -fsSL --max-time 90 -o index.html "$SRC"
        env:
          SRC: https://aka.doubaocdn.com/s/k0M8yEseij

      - name: commit
        run: |
          git config user.name "importer"
          git config user.email "importer@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "sync page"
          git push origin HEAD:main
          git push -f origin HEAD:gh-pages
